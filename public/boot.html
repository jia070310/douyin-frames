<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Douyin Frames</title>
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1e24;
        --text: #e8eaef;
        --muted: #9aa3b2;
        --accent: #3ecf8e;
        --danger: #e86a62;
        --card: rgba(255, 255, 255, 0.05);
        --line: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .box {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        padding: 28px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto;
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        object-fit: cover;
        display: block;
      }
      .title {
        font-size: 20px;
        font-weight: 650;
      }
      .msg {
        color: var(--muted);
        font-size: 13px;
        min-height: 1.5em;
        max-width: 36rem;
        margin: 0 auto;
        white-space: pre-wrap;
      }
      .msg.is-error {
        color: var(--danger);
      }
      .bar {
        width: min(360px, 80vw);
        height: 6px;
        margin: 4px auto 0;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 12%;
        background: var(--accent);
        border-radius: inherit;
        transition: width 0.25s ease;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        opacity: 0.8;
      }
      .deps {
        display: none;
        text-align: left;
        width: min(440px, 92vw);
        margin: 8px auto 0;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        gap: 10px;
      }
      .deps.is-on {
        display: grid;
      }
      .deps h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      .deps p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .deps ul {
        margin: 0;
        padding-left: 1.1em;
        font-size: 12px;
        line-height: 1.7;
      }
      .deps a {
        color: #8ad4ff;
        word-break: break-all;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .actions button {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .actions button.primary {
        background: rgba(62, 207, 142, 0.18);
        border-color: rgba(62, 207, 142, 0.45);
        color: #b6f5d4;
      }
      .actions button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .busy .bar {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="mark" src="/icons/icon-128.png" width="56" height="56" alt="" />
      <div class="title">Douyin Frames</div>
      <p class="msg" id="msg">正在准备本机环境…</p>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="deps" id="depsPanel">
        <h3>缺少依赖：FFmpeg</h3>
        <p id="depsHint">可自动下载精简包，或自行下载安装（任选其一）。</p>
        <ul id="depsLinks"></ul>
        <div class="actions">
          <button type="button" class="primary" id="btnAuto">自动下载安装</button>
          <button type="button" id="btnRecheck">我已手动安装，重新检测</button>
          <button type="button" id="btnSkip">暂时跳过</button>
        </div>
      </div>
      <p class="hint">使用系统 Edge/Chrome 应用窗口 · 不附带 Electron</p>
    </div>
    <script>
      const msg = document.getElementById('msg');
      const fill = document.getElementById('fill');
      const depsPanel = document.getElementById('depsPanel');
      const depsHint = document.getElementById('depsHint');
      const depsLinks = document.getElementById('depsLinks');
      const btnAuto = document.getElementById('btnAuto');
      const btnRecheck = document.getElementById('btnRecheck');
      const btnSkip = document.getElementById('btnSkip');

      let choosing = false;
      let busy = false;

      function setBusy(on) {
        busy = on;
        btnAuto.disabled = on;
        btnRecheck.disabled = on;
        btnSkip.disabled = on;
        document.body.classList.toggle('busy', on);
      }

      function renderDeps(data) {
        const ffmpeg = data?.deps?.ffmpeg || data?.manuals?.ffmpeg;
        if (!ffmpeg) return;
        depsHint.textContent = ffmpeg.hint || '可自动下载，或按下列地址手动安装。';
        depsLinks.innerHTML = (ffmpeg.urls || [])
          .map(
            (u) =>
              `<li><a href="${u.url}" data-url="${u.url}">${u.label}</a><br /><span style="color:var(--muted)">${u.url}</span></li>`,
          )
          .join('');
      }

      depsLinks.addEventListener('click', async (e) => {
        const a = e.target.closest('a[data-url]');
        if (!a) return;
        e.preventDefault();
        try {
          await fetch('/api/boot/deps', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'open-url', url: a.dataset.url }),
          });
        } catch {
          window.open(a.dataset.url, '_blank', 'noopener');
        }
      });

      async function postAction(action) {
        setBusy(true);
        try {
          const res = await fetch('/api/boot/deps', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            msg.textContent = data.error || '操作失败';
            msg.classList.add('is-error');
            if (data.deps) {
              choosing = true;
              depsPanel.classList.add('is-on');
              renderDeps({ deps: data.deps });
            }
            return;
          }
          if (data.ok === false) {
            msg.textContent = data.error || '仍未检测到依赖';
            msg.classList.add('is-error');
            return;
          }
          msg.classList.remove('is-error');
        } catch (err) {
          msg.textContent = err?.message || '请求失败';
          msg.classList.add('is-error');
        } finally {
          setBusy(false);
        }
      }

      btnAuto.addEventListener('click', () => postAction('auto'));
      btnRecheck.addEventListener('click', () => postAction('recheck'));
      btnSkip.addEventListener('click', () => postAction('skip'));

      function goApp() {
        const q = new URLSearchParams(location.search);
        const shell = q.get('shell') === '1' ? '?shell=1' : '';
        location.replace('/' + shell);
      }

      async function tick() {
        try {
          const res = await fetch('/api/boot');
          const data = await res.json();
          if (data.message) msg.textContent = data.message;
          msg.classList.toggle('is-error', data.stage === 'error' || !!data.error);

          if (typeof data.percent === 'number') {
            fill.style.width = Math.max(8, Math.min(100, data.percent)) + '%';
          }

          if (data.needDeps || data.stage === 'need_deps') {
            choosing = true;
            depsPanel.classList.add('is-on');
            renderDeps(data);
          } else if (!busy) {
            depsPanel.classList.remove('is-on');
            choosing = false;
          }

          if (data.ready) {
            goApp();
            return;
          }
          if (data.stage === 'error' && !data.needDeps) return;
        } catch {
          if (!choosing) msg.textContent = '等待本机服务…';
        }
        setTimeout(tick, choosing && !busy ? 1200 : 500);
      }
      tick();
    </script>
  </body>
</html>
